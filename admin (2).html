<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a252f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #2c3e50; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #e74c3c; margin-top: 0; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #e74c3c; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #c0392b; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Giriş Ekranı -->
    <div id="loginBox" class="box">
        <h2>Admin Girişi</h2>
        <input type="password" id="passInput" placeholder="Yönetici Şifrenizi Girin">
        <button onclick="login()">Giriş Yap</button>
    </div>

    <!-- Yönetim Paneli -->
    <div id="adminPanel" class="box hidden">
        <h2>Haber Ekle</h2>
        <input type="text" id="newsTitle" placeholder="Haber Başlığı">
        <input type="text" id="newsImg" placeholder="Resim URL Adresi (İsteğe bağlı)">
        <textarea id="newsContent" rows="4" placeholder="Haber Detayı/İçeriği"></textarea>
        <button onclick="addNews()">Haberi Yayınla</button>
        <button onclick="clearNews()" style="background: #7f8c8d;">Tüm Eklenen Haberleri Temizle</button>
        <p id="msg" style="color: #2ecc71; text-align: center;"></p>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === "213141") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert("Hatalı Şifre!");
            }
        }

        function addNews() {
            const title = document.getElementById('newsTitle').value;
            const img = document.getElementById('newsImg').value || 'https://picsum.photos/800/400';
            const content = document.getElementById('newsContent').value;

            if(!title || !content) {
                alert("Lütfen başlık ve içerik alanlarını doldurun!");
                return;
            }

            const newsItem = { title, img, content, date: new Date().toLocaleDateString('tr-TR') };
            let currentNews = JSON.parse(localStorage.getItem('customNews')) || [];
            currentNews.unshift(newsItem);
            localStorage.setItem('customNews', JSON.stringify(currentNews));

            document.getElementById('msg').innerText = "Haber başarıyla eklendi!";
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsImg').value = '';
            document.getElementById('newsContent').value = '';

            setTimeout(() => { document.getElementById('msg').innerText = ''; }, 3000);
        }

        function clearNews() {
            if(confirm("Eklenen tüm haberler silinecek. Emin misiniz?")) {
                localStorage.removeItem('customNews');
                alert("Haberler temizlendi.");
            }
        }
    </script>
</body>
</html>
